---
title: Educative Notebooks
author: The e-Commons Team
copyright: "2025"
logo: static/logo.png
exclude_patterns: [".DS_Store", 
                   "**.ipynb_checkpoints",
                   ".virtual_documents",
                   ".gitignore",
                   "README.md"]

execute:
  execute_notebooks: force

latex:
  latex_documents:
    targetname: book.tex
  latex_engine: xelatex

sphinx:
  config:
    html_theme: sphinx_book_theme
    html_js_files: https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.7/require.min.js
    html_theme_options:
      use_download_button: false
      show_navbar_depth: 2
      extra_footer: <a href="https://www.chalmers.se/en/infrastructure/ecommons">e-Commons</a>
      toc_title: Content

supress_warnings: ["mystnb.unknown_mime_type"]

parse:
  myst_enable_extensions:
    - html_image
    - colon_fence

html:
  favicon: static/favicon.ico
